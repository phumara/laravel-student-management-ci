name: Laravel CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/laravel-test/database.sqlite
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, curl, zip, xml
          tools: composer:v2
          coverage: none

      - name: Install project dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup environment and database
        run: |
          cp .env.example .env
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing
          php artisan config:clear
          mkdir -p /tmp/laravel-test
          touch /tmp/laravel-test/database.sqlite
          php artisan migrate --force --env=testing

      - name: Run Laravel tests
        run: php artisan test